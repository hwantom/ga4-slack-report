name: GA4 Daily Slack Report & Dashboard Deploy

on:
  schedule:
    # 매일 한국시간 오전 9:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  report-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create and Validate Service Account Key
        run: |
          echo "${{ secrets.GCP_SA_KEY_BASE64 }}" | base64 --decode > service-account.json
          python -c "import json; json.load(open('service-account.json')); print('Service account JSON valid')"

      - name: Run GA4 Report & Update data.json
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
        run: |
          python main.py

      - name: Remove Temporary Service Account Key
        if: always()
        run: |
          rm -f service-account.json

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update GA4 dashboard data [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
